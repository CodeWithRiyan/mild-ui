name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Publish a snapshot of pending changesets to the npm "next" tag'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Let changesets/action push with the token below instead of the checkout token.
          persist-credentials: false
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      - name: Create "Version Packages" PR or publish to npm
        if: github.event_name == 'push'
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          # A PR opened with the default GITHUB_TOKEN does not trigger ci.yml, so required checks
          # never report on "Version Packages". CHANGESETS_TOKEN (fine-grained PAT: contents and
          # pull requests read/write on this repo) avoids that; GITHUB_TOKEN is the fallback.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          # The version commit is generated; skip the pre-commit hook in CI.
          HUSKY: "0"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish snapshot to the "next" tag
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: |
          pnpm changeset version --snapshot next
          pnpm --filter "./packages/*" build
          pnpm changeset publish --tag next --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
