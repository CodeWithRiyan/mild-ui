name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      snapshot:
        description: 'Publish a snapshot of pending changesets to the npm "next" tag'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Let changesets/action push with the token below instead of the checkout token.
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: pnpm
          registry-url: "https://registry.npmjs.org"
      - run: pnpm install --frozen-lockfile

      - name: Create "Version Packages" PR or publish to npm
        if: github.event_name == 'push'
        uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
        with:
          version: pnpm version-packages
          publish: pnpm release
          title: Version Packages
          commit: "chore: version packages"
          createGithubReleases: true
        env:
          # A PR opened with the default GITHUB_TOKEN does not trigger ci.yml, so required checks
          # never report on "Version Packages". CHANGESETS_TOKEN (fine-grained PAT: contents and
          # pull requests read/write on this repo) avoids that; GITHUB_TOKEN is the fallback.
          GITHUB_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
          # The version commit is generated; skip the pre-commit hook in CI.
          HUSKY: "0"
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true

      - name: Publish snapshot to the "next" tag
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: |
          pnpm changeset version --snapshot next
          pnpm --filter "./packages/*" build
          pnpm changeset publish --tag next --no-git-tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
