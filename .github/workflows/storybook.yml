name: Build and Deploy Multi-Framework Storybooks + Core Docs
on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/react/**"
      - "packages/vue/**"
      - "storybook/react/**"
      - "storybook/vue/**"
      - "site/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The Storybooks bundle the React and Vue sources, which import the built primitives.
      - name: Build primitives package
        run: pnpm --filter @mild-ui/primitives build

      - name: Build core package (CSS only)
        run: pnpm --filter @mild-ui/core build

      - name: Build React package
        run: pnpm --filter @mild-ui/react build

      - name: Build Vue package
        run: pnpm --filter @mild-ui/vue build

      # Generate Core Documentation using our docs generator
      - name: Generate Core Documentation
        run: |
          cd packages/core
          # Use our documentation generator that creates utilities as index
          pnpm run docs:generate
        env:
          NODE_ENV: production

      - name: Build React Storybook
        run: |
          cd storybook/react
          STORYBOOK_BASE_URL="/mild-ui/react/" pnpm build
        env:
          NODE_ENV: production
          CI: true

      - name: Build Vue Storybook
        run: |
          cd storybook/vue
          STORYBOOK_BASE_URL="/mild-ui/vue/" pnpm build
        env:
          NODE_ENV: production
          CI: true

      - name: Create deployment directory
        run: |
          mkdir -p deploy
          mkdir -p deploy/react
          mkdir -p deploy/vue
          mkdir -p deploy/core

      - name: Copy React Storybook
        run: cp -r storybook/react/storybook-static/* deploy/react/

      - name: Copy Vue Storybook
        run: cp -r storybook/vue/storybook-static/* deploy/vue/

      # Copy Core Documentation
      - name: Copy Core Documentation
        run: |
          if [ -d "packages/core/docs" ]; then
            cp -r packages/core/docs/* deploy/core/
          else
            echo "Core docs not found, skipping..."
          fi

      # The landing page lives in site/ (plain HTML on top of the core stylesheet) so it can be
      # previewed and linted like any other file; the build date is stamped at deploy time.
      - name: Copy landing page
        run: |
          cp -r site/. deploy/
          rm -f deploy/README.md
          cp packages/core/dist/mild-ui.min.css deploy/assets/mild-ui.min.css
          sed -i "s|<html lang=\"en\">|<html lang=\"en\" data-build-date=\"$(date -u +%Y-%m-%d)\" data-commit=\"${GITHUB_SHA::7}\">|" deploy/index.html

      - name: Add .nojekyll file
        run: touch deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
