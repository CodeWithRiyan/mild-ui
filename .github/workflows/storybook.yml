name: Build and Deploy Storybook + Core Docs
on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "packages/react/**"
      - "storybook/react/**"
      - ".github/workflows/storybook.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core package (CSS only)
        run: pnpm --filter @mild-ui/core build

      - name: Build React package
        run: pnpm --filter @mild-ui/react build

      # Generate Core Documentation using our docs generator
      - name: Generate Core Documentation
        run: |
          cd packages/core
          # Use our documentation generator that creates utilities as index
          pnpm run docs:generate
        env:
          NODE_ENV: production

      - name: Build React Storybook
        run: |
          cd storybook/react
          STORYBOOK_BASE_URL="/mild-ui/react/" pnpm build
        env:
          NODE_ENV: production
          CI: true

      - name: Create deployment directory
        run: |
          mkdir -p deploy
          mkdir -p deploy/react
          mkdir -p deploy/core

      - name: Copy React Storybook
        run: cp -r storybook/react/storybook-static/* deploy/react/

      # Copy Core Documentation
      - name: Copy Core Documentation
        run: |
          if [ -d "packages/core/docs" ]; then
            cp -r packages/core/docs/* deploy/core/
          else
            echo "Core docs not found, skipping..."
          fi

      - name: Create enhanced main index page
        run: |
          cat > deploy/index.html << 'EOF'
          <!DOCTYPE html>
          <html lang="en">
          <head>
              <meta charset="UTF-8">
              <meta name="viewport" content="width=device-width, initial-scale=1.0">
              <title>mild-ui Component Library</title>
              <style>
                  body {
                      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', sans-serif;
                      max-width: 1200px;
                      margin: 0 auto;
                      padding: 2rem;
                      background: #fafafa;
                      line-height: 1.6;
                  }
                  .container {
                      background: white;
                      padding: 3rem;
                      border-radius: 12px;
                      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
                  }
                  h1 {
                      color: #1f2937;
                      border-bottom: 3px solid #3b82f6;
                      padding-bottom: 1rem;
                      margin-bottom: 2rem;
                  }
                  .description {
                      color: #6b7280;
                      font-size: 1.1rem;
                      margin-bottom: 3rem;
                  }
                  .sections {
                      display: grid;
                      gap: 2rem;
                  }
                  .section {
                      border: 1px solid #e5e7eb;
                      border-radius: 8px;
                      overflow: hidden;
                  }
                  .section-header {
                      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
                      color: white;
                      padding: 1.5rem;
                      margin: 0;
                      font-size: 1.25rem;
                      font-weight: 600;
                  }
                  .section-content {
                      padding: 1.5rem;
                  }
                  .frameworks {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
                      gap: 1.5rem;
                      margin-top: 1rem;
                  }
                  .docs-grid {
                      display: grid;
                      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
                      gap: 1rem;
                      margin-top: 1rem;
                  }
                  .framework-card, .doc-card {
                      border: 1px solid #e5e7eb;
                      border-radius: 8px;
                      padding: 1.5rem;
                      text-align: center;
                      transition: all 0.2s ease;
                      background: white;
                  }
                  .framework-card:hover, .doc-card:hover {
                      transform: translateY(-2px);
                      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
                      border-color: #3b82f6;
                  }
                  .framework-card h3, .doc-card h3 {
                      margin: 0 0 1rem 0;
                      color: #374151;
                      font-size: 1.1rem;
                  }
                  .framework-card p, .doc-card p {
                      color: #6b7280;
                      margin-bottom: 1.5rem;
                      font-size: 0.95rem;
                  }
                  .framework-card a, .doc-card a {
                      display: inline-block;
                      background: #3b82f6;
                      color: white;
                      padding: 0.75rem 1.5rem;
                      text-decoration: none;
                      border-radius: 6px;
                      font-weight: 500;
                      font-size: 0.9rem;
                      transition: background 0.2s;
                  }
                  .framework-card a:hover, .doc-card a:hover {
                      background: #2563eb;
                  }
                  .badge {
                      display: inline-block;
                      background: #10b981;
                      color: white;
                      padding: 0.25rem 0.75rem;
                      border-radius: 9999px;
                      font-size: 0.875rem;
                      font-weight: 500;
                      margin-left: 0.5rem;
                  }
                  .auto-badge {
                      background: #8b5cf6;
                  }
                  .footer {
                      margin-top: 3rem;
                      text-align: center;
                      color: #6b7280;
                      font-size: 0.9rem;
                  }
                  .footer a {
                      color: #3b82f6;
                      text-decoration: none;
                  }
              </style>
          </head>
          <body>
              <div class="container">
                  <h1>mild-ui Component Library 
                      <span class="badge">React</span>
                      <span class="badge auto-badge">Auto-Generated</span>
                  </h1>
                  
                  <p class="description">
                      Welcome to mild-ui, a React UI component library with SASS-powered styling. 
                      React components styled by a shared SCSS design system, with comprehensive documentation.
                  </p>

                  <div class="sections">
                      <div class="section">
                          <h2 class="section-header">🧩 Interactive Component Documentation</h2>
                          <div class="section-content">
                              <p>Live, interactive examples of every React component:</p>
                              <div class="frameworks">
                                  <div class="framework-card">
                                      <h3>⚛️ React Components</h3>
                                      <p>Interactive React components with hooks and modern patterns</p>
                                      <a href="./react/">Explore React Storybook</a>
                                  </div>
                              </div>
                          </div>
                      </div>

                      <div class="section">
                          <h2 class="section-header">📚 Core Documentation & API</h2>
                          <div class="section-content">
                              <p>Auto-generated documentation from source code, design tokens, and APIs:</p>
                              <div class="docs-grid">
                                  <div class="doc-card">
                                      <h3>🎨 Utility Classes Reference</h3>
                                      <p>Interactive reference for all 1600+ utility classes</p>
                                      <a href="./core/">Browse Utilities</a>
                                  </div>
                                  
                                  
                                  <div class="doc-card">
                                      <h3>📊 Package Overview</h3>
                                      <p>Package info, installation, and architecture</p>
                                      <a href="./core/overview.html">View Package Info</a>
                                  </div>
                                  
                                  <div class="doc-card">
                                      <h3>⚛️ React API</h3>
                                      <p>React component props and TypeScript types</p>
                                      <a href="./react/">React Components</a>
                                  </div>
                              </div>
                          </div>
                      </div>
                  </div>
                  
                  <div class="footer">
                      <p>
                          📝 Documentation auto-generated on $(date) | 
                          <a href="https://github.com/CodeWithRiyan/mild-ui">View Source Code</a>
                      </p>
                  </div>
              </div>
          </body>
          </html>
          EOF

      - name: Add .nojekyll file
        run: touch deploy/.nojekyll

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@373f7f263a76c20808c831209c920827a82a2847 # v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
