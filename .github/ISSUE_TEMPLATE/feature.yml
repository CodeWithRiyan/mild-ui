name: Feature request
description: Suggest a component, prop, or improvement.
labels: ["enhancement"]
body:
  - type: dropdown
    id: framework
    attributes:
      label: Framework
      multiple: true
      options:
        - React
        - CSS only (@mild-ui/core)
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and why is it hard today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: The API or behavior you would like, with a code example if possible.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
