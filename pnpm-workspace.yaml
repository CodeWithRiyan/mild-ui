packages:
  - "packages/*"
  - "apps/*"
  - "storybook/*"
  - "examples/*"

onlyBuiltDependencies:
  - esbuild

ignoredBuiltDependencies:
  - "@parcel/watcher"
  - "@swc/core"

# Security fixes for transitive dev dependencies whose parents have no fixed release yet.
overrides:
  "serve>compression": "^1.8.2"
  "uuid@<11.1.1": "^11.1.1"
  "joi@>=17.1.1 <17.13.9": "^17.13.9"
  "fast-uri@>=3.0.0 <3.1.9": "^3.1.9"

  # Sandbox registry snapshot is missing some recently-published versions; pin to the
  # closest available release so installs resolve.
  "postcss-selector-parser@6.1.5": "6.1.4"
  "sass@>=1.106.0 <2": "1.105.1"
  "vitest@>=4.1.12 <5": "4.1.11"
