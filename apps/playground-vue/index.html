<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>mild-ui vue playground</title>
    <!-- Anti-flicker: applies the saved color mode before first paint. Generated by
         getColorModeScript() from @mild-ui/vue; src/color-mode-script.test.ts keeps it in sync. -->
    <!-- prettier-ignore -->
    <script data-mild-color-mode-script>(function(){try{var k="mild-ui-color-mode",d="system";var m=localStorage.getItem(k);if(m!=="light"&&m!=="dark"&&m!=="system")m=d;var r=m==="system"?(window.matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"):m;var e=document.documentElement;e.setAttribute("data-theme",r);e.setAttribute("data-color-mode",m);e.style.colorScheme=r;}catch(e){}})();</script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
